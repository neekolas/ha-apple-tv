[project]
name = "atv-bridge-integration-tests"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "homeassistant==2026.11.2",
    "pytest-homeassistant==2026.11.2",
    # Keep these aligned with HA's Assist component constraints.
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["../.."]
