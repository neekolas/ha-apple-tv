name: App image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: tv-use-bridge

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Stage the build context
        run: app/build/stage-context.sh

      - name: Read the app version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' app/config.yaml | tr -d "\"'")
          test -n "$version" || { echo "No version in app/config.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.arch }}-${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=tv-use bridge (${{ matrix.arch }})
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  manifest:
    name: Multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest tags
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          base="$REGISTRY/$GITHUB_REPOSITORY_OWNER"
          sha="sha-${GITHUB_SHA::7}"
          tags="$sha"
          if [ "$ON_MAIN" = true ]; then
            version=$(sed -n 's/^version:[[:space:]]*//p' app/config.yaml | tr -d "\"'")
            tags="$tags latest $version"
          fi
          args=""
          for tag in $tags; do args="$args -t $base/$IMAGE:$tag"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $args \
            "$base/aarch64-$IMAGE:$sha" "$base/amd64-$IMAGE:$sha"
          docker buildx imagetools inspect "$base/$IMAGE:$sha"
