<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Working</title>
<style>
  html, body { margin: 0; height: 100%; background: #101114; color: #f2f2f2; font: 36px/1.35 system-ui, sans-serif; }
  body { box-sizing: border-box; padding: 60px 80px; display: flex; flex-direction: column; gap: 40px; }
  h1 { margin: 0; font-size: 72px; line-height: 1.1; }
  main { flex: 1; display: grid; gap: 32px; align-content: start; }
  [data-slot] { transition: opacity 300ms; }
  [data-slot].pending { color: #8a8d96; }
  [data-slot].pending::after { content: ""; display: block; width: 60%; height: 28px; margin-top: 14px; border-radius: 14px; background: #262830; }
  #status { min-height: 48px; font-size: 32px; color: #b9bcc6; display: flex; align-items: center; gap: 18px; }
  #status[hidden] { display: none; }
  #status .dot { width: 18px; height: 18px; border-radius: 50%; background: #5b8cff; animation: beat 2s steps(2, jump-none) infinite; }
  @keyframes beat { from { opacity: 1; } to { opacity: 0.3; } }
</style>
<h1 id="title" data-slot="title"></h1>
<main id="slots"></main>
<div id="status" role="status" hidden><span class="dot"></span><span id="status-text"></span></div>
<script>
  // Call these with tv_page_run, for example:
  //   tv_page_run {"script":"tv.working(arg)","arg":"Finding a recipe"}
  //   tv_page_run {"script":"tv.fill('steps', arg)","arg":"<ol><li>Boil water</li></ol>"}
  //   tv_page_run {"script":"tv.done()"}
  const slot = name => {
    let el = document.querySelector(`[data-slot="${CSS.escape(name)}"]`);
    if (!el) {
      el = document.createElement("section");
      el.dataset.slot = name;
      document.getElementById("slots").append(el);
    }
    return el;
  };
  const state = () => ({
    working: document.getElementById("status").hidden ? null : document.getElementById("status-text").textContent,
    pending: [...document.querySelectorAll("[data-slot].pending")].map(el => el.dataset.slot),
  });
  window.tv = {
    // Show what you are doing now. Short present-tense text, such as "Finding a recipe".
    working(text) {
      document.getElementById("status-text").textContent = text;
      document.getElementById("status").hidden = false;
      return state();
    },
    // Reserve a place for a result that is still coming. The label says what will appear.
    pending(name, label = "") {
      const el = slot(name);
      el.classList.add("pending");
      el.textContent = label;
      return state();
    },
    // Put a result in its place. Use html for markup; plain text is fine too.
    fill(name, html) {
      const el = slot(name);
      el.classList.remove("pending");
      el.innerHTML = html;
      return state();
    },
    // Hide the status line when nothing is in progress.
    done() {
      document.getElementById("status").hidden = true;
      return state();
    },
    state,
  };
  // Edit these first lines for the request. Show the page at once, then fill it.
  tv.fill("title", "Pork bulgogi");
  tv.pending("summary", "Recipe summary");
  tv.pending("steps", "Steps");
  tv.working("Finding a recipe");
</script>
