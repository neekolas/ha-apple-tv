name: Apple TV Agent Bridge
slug: atv_bridge
version: 0.1.2
description: Control, observe and present pages on a paired Apple TV
arch: [aarch64, amd64]
host_network: true
ingress: true
ingress_port: 8099
panel_title: Apple TV Bridge
panel_icon: mdi:television
init: false
discovery: [atv_bridge]
homeassistant_api: true
hassio_api: true
startup: application
boot: auto
tmpfs: true
watchdog: http://[HOST]:8766/api/health
options:
  apple_tvs: []
  max_active_mirrors: 1
  apple_tv_host: ""
  apple_tv_id: ""
  presentation_mode: mirror
  mirror_size: 1920x1080
  page_scripts: true
  page_network_allow: []
  mirror_fps: 10
  default_profile: ""
  app_profile: ""
  watch_history: true
  history_interval: 300
  history_fast_interval: 15
  history_max_entries: 2000
  log_level: info
schema:
  apple_tvs:
    - name: str?
      host: str?
      id: str?
  max_active_mirrors: int(1,)
  apple_tv_host: str?
  apple_tv_id: str?
  presentation_mode: list(mirror|play_url|auto)
  mirror_size: list(1280x720|1920x1080)
  page_scripts: bool
  page_network_allow:
    - str
  mirror_fps: int(1,60)
  default_profile: str?
  app_profile: str?
  watch_history: bool
  history_interval: int(30,3600)
  history_fast_interval: int(5,300)
  history_max_entries: int(100,20000)
  log_level: list(debug|info|warning|error)
backup_exclude:
  - content
  - .cache
  - media/stage-*.mp4
  - render-cache
  - tvs/*/media/stage-*.mp4
  - tvs/*/render-cache
