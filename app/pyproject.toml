[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "atv-bridge-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["atv_bridge_app*", "atv_bridge_observer*"]

[tool.setuptools.package-data]
atv_bridge_observer = ["licenses/*.txt"]
atv_bridge_app = ["data/*.yaml", "data/*.html", "data/*.js", "present/*.js"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2,<3",
    "pytest>=9.2,<10",
    "pytest-aiohttp>=1.1.1,<2",
    "pytest-asyncio>=1.5,<2",
]
image-build = ["pip>=26.3,<27", "setuptools>=84.2.1,<85"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
pyatv = {path = "../vendor/pyatv"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
