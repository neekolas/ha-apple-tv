<!doctype html>
<meta charset="utf-8">
<title>S2b stage</title>
<style>html,body,iframe{width:100%;height:100%;border:0;margin:0;display:block;overflow:hidden}body{background:#faf4e5}</style>
<iframe id="content" title="Presentation" sandbox="allow-scripts allow-forms allow-presentation" allow="autoplay *"></iframe>
<script>
const params = new URLSearchParams(location.search);
const page = params.get("page");
const fixture = ["static", "slides"].includes(page) ? "recipe" : page;
const content = document.getElementById("content");
content.onload = () => {
  if (page !== "step") return;
  const send = command => content.contentWindow.postMessage({command}, "*");
  if (params.has("freeze")) send("next");
  else setInterval(() => send("next"), 2000);
};
content.src = "/" + fixture + "?" + params;
</script>
